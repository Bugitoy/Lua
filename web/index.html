<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lua</title>
    <meta name="description" content="Lua is a walking app with a pixel-art companion. Set goals at real places, walk there, and Lua grows with you." />
    <meta name="theme-color" content="#16a34a" />
    <link rel="icon" href="/lua.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;700&display=swap" rel="stylesheet" />
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px 16px;
        background: #f5f5f5;
        color: #171717;
        font-family: "Pixelify Sans", system-ui, sans-serif;
        text-align: center;
      }
      main { max-width: 380px; }
      img { width: 72px; image-rendering: pixelated; }
      h1 { font-size: 32px; margin: 12px 0 6px; }
      p { font-size: 15px; line-height: 1.45; color: #737373; margin: 0; }
    </style>
  </head>
  <body>
    <main>
      <img src="/lua.png" alt="" />
      <h1>Lua</h1>
      <p>A walking app with a pixel-art companion. Set goals at real places, walk there, and Lua grows with you.</p>
    </main>
  </body>
</html>
